services:
  db:
    container_name: event-db
    image: mariadb:12.3
    restart: always # Automatically restarts the container if it fails or if Docker restarts
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1111
      MYSQL_DATABASE: event-db
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: # Declares the named volume used by the database service
   driver: local